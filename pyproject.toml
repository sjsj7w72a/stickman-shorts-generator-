[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stickman-shorts-generator"
version = "0.1.0"
description = "Script-driven stick figure video rendering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.1,<13"]

[project.scripts]
stickman-shorts = "stickman:main"

[tool.setuptools]
py-modules = ["stickman"]
